<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Quick Translate - Options</title>
	<style>
		body { font-family: sans-serif; font-size: 14px; padding: 10px 16px; min-width: 320px; }
		label { display: block; margin: 12px 0 4px; font-weight: bold; }
		select, input { width: 100%; padding: 4px; box-sizing: border-box; }
		button { margin-top: 16px; padding: 6px 16px; }
		#status { margin-left: 8px; color: green; }
		.hint { color: #666; font-size: 12px; margin-top: 4px; }
		label.check { margin-top: 16px; }
		label.check input { width: auto; margin: 0 6px 0 0; }
	</style>
</head>
<body>
	<label for="targetLanguage">Google Translate language</label>
	<select id="targetLanguage">
		<option value="bn">Bengali</option>
		<option value="hi">Hindi</option>
		<option value="zh-CN">Chinese (Simplified)</option>
		<option value="es">Spanish</option>
		<option value="ar">Arabic</option>
		<option value="fr">French</option>
		<option value="pt">Portuguese</option>
		<option value="ru">Russian</option>
		<option value="ur">Urdu</option>
		<option value="id">Indonesian</option>
	</select>

	<label class="check"><input type="checkbox" id="thesaurusEnabled"> Show synonyms (thesaurus)</label>

	<label for="thesaurusKey">Thesaurus key</label>
	<input type="password" id="thesaurusKey" autocomplete="off">
	<div class="hint">Free key from thesaurus.altervista.org. Stored only on this PC.</div>

	<button id="save">Save</button><span id="status"></span>

	<script src="options.js"></script>
</body>
</html>
